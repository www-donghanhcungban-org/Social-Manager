name: CodeQL

# SAST cho mã CHẠY THẬT của khung (audit 2026-09-23, C12): 4 engine Python + workflow Actions. Trước
# đây SECURITY.md nói "không có mã để quét CodeQL" — sai từ khi scripts/*.py xuất hiện (PR #89/#91).
# Dự án đích: thêm ngôn ngữ của stack vào `language` (js-ts, go, java-kotlin, csharp, ruby, swift…).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'   # thứ Hai hằng tuần — bắt query mới của CodeQL trên mã cũ

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # tải SARIF lên tab Security → Code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
