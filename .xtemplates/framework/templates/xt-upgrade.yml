name: Nâng cấp công cụ quy trình
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: read # check tìm PR nâng bản đang mở trỏ phiên bản đã thu hồi
concurrency:
  group: xt-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    # lịch luôn chạy trên nhánh mặc định, payload của schedule không có `repository`
    if: github.event_name == 'schedule' || github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - id: check
        name: Chọn tag đã xác minh và đủ tuổi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          python3 .xtemplates/scripts/xt.py upgrade check || status=$?
          case "$status" in
            0|11) ;;
            10) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Mở hoặc cập nhật PR của dự án
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.XT_STEWARD_TOKEN }}
          GIT_AUTHOR_NAME: xt-upgrade
          GIT_AUTHOR_EMAIL: xt-upgrade@users.noreply.github.com
          GIT_COMMITTER_NAME: xt-upgrade
          GIT_COMMITTER_EMAIL: xt-upgrade@users.noreply.github.com
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Cần XT_STEWARD_TOKEN của dự án để CI chạy cho PR nâng bản."; exit 1; }
          gh auth setup-git --hostname github.com
          python3 .xtemplates/scripts/xt.py upgrade open-pr
